<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9b44c"/>
      <stop offset="100%" style="stop-color:#d4a03a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <symbol id="crown-icon" viewBox="0 0 40 40">
      <path d="M20,2 L24,14 L38,14 L26,22 L30,36 L20,28 L10,36 L14,22 L2,14 L16,14 Z" 
            fill="url(#goldGrad)" stroke="#fff" stroke-width="1"/>
      <circle cx="20" cy="8" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="8" cy="16" r="2" fill="#fff" opacity="0.6"/>
      <circle cx="32" cy="16" r="2" fill="#fff" opacity="0.6"/>
    </symbol>
    
    <symbol id="coin-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="url(#goldGrad)" stroke="#fff" stroke-width="1"/>
      <text x="12" y="16" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="bold">$</text>
    </symbol>
    
    <symbol id="shield-icon" viewBox="0 0 24 24">
      <path d="M12,2 L22,8 v8 L12,22 L2,16 V8 Z" fill="url(#goldGrad)" stroke="#fff" stroke-width="1"/>
    </symbol>
  </defs>
  
  <rect width="300" height="420" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="280" height="400" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="15"/>
  <rect x="20" y="20" width="260" height="380" fill="none" stroke="#2a2a4a" stroke-width="1" rx="10"/>
  
  <g transform="translate(150, 60)">
    <circle r="35" fill="url(#goldGrad)" filter="url(#glow)"/>
    <use href="#crown-icon" xlink:href="#crown-icon" x="-20" y="-20" width="40" height="40"/>
  </g>
  
  <text x="150" y="140" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" letter-spacing="3">DUQUE</text>
  <text x="150" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#b0b0b0" letter-spacing="1">LORD OF THE COURT</text>
  
  <g transform="translate(150, 195)" fill="url(#goldGrad)">
    <path d="M-60,0 L-20,0 M20,0 L60,0" stroke-width="2"/>
    <circle r="4" cy="0"/>
  </g>
  
  <g transform="translate(150, 280)">
    <path d="M-80,40 L-80,-60 L-60,-60 L-60,-80 L60,-80 L60,-60 L80,-60 L80,40 Z" fill="#16213e" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M-50,-80 L-50,-100 L50,-100 L50,-80" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="-50" cy="-100" r="8" fill="url(#goldGrad)"/>
    <circle cx="50" cy="-100" r="8" fill="url(#goldGrad)"/>
    
    <path d="M-10,40 Q-10,-20 0,-60 Q10,-20 10,40" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="12" fill="url(#goldGrad)">
      <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(150, 380)" fill="#e9b44c" font-family="Georgia, serif" font-size="11" text-anchor="middle">
    <text x="-100" y="0"><use href="#coin-icon" xlink:href="#coin-icon" x="-12" y="-10" width="20" height="20"/> AJUDA EXTERNA (+2)</text>
    <text x="100" y="0"><use href="#shield-icon" xlink:href="#shield-icon" x="-12" y="-10" width="20" height="20"/> BLOQUEIA AJUDA</text>
  </g>
  
  <g transform="translate(40, 380)" fill="url(#goldGrad)" opacity="0.7">
    <use href="#crown-icon" xlink:href="#crown-icon" x="-12" y="-12" width="24" height="24"/>
  </g>
  <g transform="translate(260, 380)" fill="url(#goldGrad)" opacity="0.7">
    <use href="#crown-icon" xlink:href="#crown-icon" x="-12" y="-12" width="24" height="24"/>
  </g>
</svg>