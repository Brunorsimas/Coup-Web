<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ce98e"/>
      <stop offset="100%" style="stop-color:#3ac97a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <symbol id="handshake-icon" viewBox="0 0 40 40">
      <path d="M8,25 Q8,15 15,12 Q20,10 20,20 Q20,15 28,18" 
            fill="none" stroke="url(#greenGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M32,25 Q32,15 25,12 Q20,10 20,20 Q20,15 12,18" 
            fill="none" stroke="url(#greenGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="5" fill="url(#greenGrad)">
        <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      </circle>
    </symbol>
    
    <symbol id="swap-icon" viewBox="0 0 24 24">
      <path d="M7,16 L1,10 L7,4 M17,8 L23,2 L17,-4" 
            fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1,14 L7,20 L1,26 M23,10 L17,16 L23,22" 
            fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    
    <symbol id="shield-icon" viewBox="0 0 24 24">
      <path d="M12,2 L22,8 v8 L12,22 L2,16 V8 Z" fill="url(#greenGrad)" stroke="#fff" stroke-width="1"/>
    </symbol>
  </defs>
  
  <rect width="300" height="420" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="280" height="400" fill="none" stroke="url(#greenGrad)" stroke-width="3" rx="15"/>
  <rect x="20" y="20" width="260" height="380" fill="none" stroke="#2a2a4a" stroke-width="1" rx="10"/>
  
  <g transform="translate(150, 60)">
    <circle r="35" fill="url(#greenGrad)" filter="url(#glow)"/>
    <use href="#handshake-icon" xlink:href="#handshake-icon" x="-20" y="-20" width="40" height="40"/>
  </g>
  
  <text x="150" y="140" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="24" font-weight="bold" fill="url(#greenGrad)" letter-spacing="2">EMBAIXADORA</text>
  <text x="150" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#b0b0b0" letter-spacing="1">MISTRESS OF WHISPERS</text>
  
  <g transform="translate(150, 195)" fill="url(#greenGrad)">
    <path d="M-60,0 L-20,0 M20,0 L60,0" stroke-width="2"/>
    <circle r="4" cy="0"/>
  </g>
  
  <g transform="translate(150, 280)">
    <g transform="translate(-50, 0)">
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#16213e" stroke="url(#greenGrad)" stroke-width="2"/>
      <ellipse cx="-10" cy="-10" rx="8" ry="10" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
      <ellipse cx="10" cy="-10" rx="8" ry="10" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
      <path d="M-15,15 Q0,25 15,15" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,0; 0,0" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(50, 0)">
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#16213e" stroke="url(#greenGrad)" stroke-width="2"/>
      <ellipse cx="-10" cy="-10" rx="8" ry="10" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
      <ellipse cx="10" cy="-10" rx="8" ry="10" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
      <path d="M-15,15 Q0,25 15,15" fill="none" stroke="url(#greenGrad)" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,0; 0,0" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(0, 50)" stroke="url(#greenGrad)" stroke-width="3" fill="url(#greenGrad)">
      <path d="M-20,-10 L0,0 L-20,10" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M20,-10 L0,0 L20,10" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0,0; -40,0; 0,0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <g transform="translate(0, -20)" fill="#0f3460" stroke="url(#greenGrad)" stroke-width="1.5" opacity="0.7">
      <rect x="-70" y="-10" width="25" height="35" rx="3">
        <animateTransform attributeName="transform" type="rotate" values="0;5;0;-5;0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="45" y="-10" width="25" height="35" rx="3">
        <animateTransform attributeName="transform" type="rotate" values="0;-5;0;5;0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  
  <g transform="translate(150, 380)" fill="#4ce98e" font-family="Georgia, serif" font-size="11" text-anchor="middle">
    <text x="-100" y="0"><use href="#swap-icon" xlink:href="#swap-icon" x="-12" y="-10" width="24" height="24"/> TROCA CARTAS</text>
    <text x="100" y="0"><use href="#shield-icon" xlink:href="#shield-icon" x="-12" y="-10" width="20" height="20"/> BLOQUEIA ROUBO E TROCA</text>
  </g>
  
  <g transform="translate(40, 380)" fill="url(#greenGrad)" opacity="0.7">
    <use href="#handshake-icon" xlink:href="#handshake-icon" x="-12" y="-12" width="24" height="24"/>
  </g>
  <g transform="translate(260, 380)" fill="url(#greenGrad)" opacity="0.7">
    <use href="#handshake-icon" xlink:href="#handshake-icon" x="-12" y="-12" width="24" height="24"/>
  </g>
</svg>